<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2>Examples of CSS styling lists</h2>
    <p>Examples of Ordered lists are as following:</p>
    <ol class="A">
    <li>football</li>
    <li>cricket</li>
    <li>hockey</li>
    </ol>

    <ol class="B">
        <li>basketball</li>
        <li>tennis</li>
        <li>swimming</li>
    </ol>

    <p>Examples of Unordered lists are as following:</p>
    <ul class="C">
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ul>

    <ul class="D">
        <li>spain</li>
        <li>france</li>
        <li>germany</li>
    </ul>

</body>
</html>
